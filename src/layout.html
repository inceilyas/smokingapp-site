<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_TITLE}} | {{APP_NAME}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="color-scheme" content="dark light">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="alternate" hreflang="tr" href="{{ALT_TR}}">
  <link rel="alternate" hreflang="en" href="{{ALT_EN}}">
  <link rel="icon" type="image/svg+xml" href="{{ROOT}}assets/favicon.svg">
  <link rel="stylesheet" href="{{ROOT}}assets/style.css">
</head>
<body>
  <a class="skip" href="#main">{{SKIP}}</a>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="{{HOME}}"><span class="dot" aria-hidden="true"></span>{{APP_NAME}}</a>
      <nav aria-label="{{MENU}}">
        {{NAV}}
      </nav>
      <a class="lang" href="{{SWITCH_HREF}}" hreflang="{{SWITCH_LANG}}" lang="{{SWITCH_LANG}}" title="{{SWITCH_TITLE}}">{{SWITCH_LABEL}}</a>
    </div>
  </header>
  <main id="main" class="wrap">
{{CONTENT}}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>{{FOOTER_NOTE}}</p>
      <p class="links">{{FOOTER_LINKS}} <a href="mailto:{{SUPPORT_EMAIL}}">{{SUPPORT_EMAIL}}</a></p>
      <p class="small">&copy; 2026 {{APP_NAME}}. {{FOOTER_RIGHTS}}</p>
    </div>
  </footer>
</body>
</html>
